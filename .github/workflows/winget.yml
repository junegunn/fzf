name: Publish to Winget
on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: true
    secrets:
      WINGET_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag to submit (e.g. v0.73.1)'
        required: true
        type: string

# winget-releaser passes this token to unpinned actions. Submission uses
# WINGET_TOKEN.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal2009/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: junegunn.fzf
          release-tag: ${{ inputs.release-tag }}
          installers-regex: '-windows_(arm64|amd64)\.(zip|msi)$'
          token: ${{ secrets.WINGET_TOKEN }}
